name: Publish to Hex

# A tag publishes. vX.Y.0 releases every package in the root mix.exs's publish
# order (a lockstep minor); <package>-vX.Y.Z releases that package alone (a
# patch). A manual run rehearses a tag: every guard runs, nothing publishes.
#
# Two jobs. `guard` runs on a tag and on a manual run, holds no environment and
# no OIDC token, and does the guards and, on a manual run, the dry-run publish
# of each package. `publish` runs on a tag only, after `guard`: it alone runs in
# `prod` and may mint the OIDC token hex.pm exchanges for a publish token.

on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse (dry run: nothing is published)"
        required: true
      ci_ok_wait_seconds:
        description: "Seconds to wait for ci-ok (a branch has none, so a rehearsal can shorten this)"
        type: string
        default: "1200"

permissions:
  contents: read
  checks: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'push' && '0' || '1' }}
      GH_TOKEN: ${{ github.token }}
      # Only a manual run may shorten the wait; a tag push is always bounded at 1200 s.
      CI_OK_WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_ok_wait_seconds || '1200' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - id: plan
        name: resolve the publish set
        continue-on-error: ${{ env.DRY_RUN == '1' }}
        run: |
          order="$(mix publish_order | tr '\n' ' ' | sed 's/ $//')"
          if [ "$order" != "req_managed_agents req_managed_agents_host" ]; then
            echo "::error::mix publish_order is '$order'; this workflow's publish steps are req_managed_agents, then req_managed_agents_host"
            exit 1
          fi
          read -r -a packages <<<"$order"
          bash .github/scripts/publish-plan.sh "$TAG" "${packages[@]}" >> "$GITHUB_OUTPUT"
      - id: versions
        name: each selected package's @version equals the tag's
        continue-on-error: ${{ env.DRY_RUN == '1' }}
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          [ -n "$PACKAGES" ] || { echo "::error::no publish plan"; exit 1; }
          bad=0
          read -r -a packages <<<"$PACKAGES"
          for p in "${packages[@]}"; do
            v="$(mix package_version "$p")"
            if [ "$v" != "$VERSION" ]; then echo "::error::$p @version is $v; the tag says $VERSION"; bad=1; fi
          done
          exit $bad
      - id: reachable
        name: the tagged commit is on main's first-parent history
        continue-on-error: ${{ env.DRY_RUN == '1' }}
        # A commit reachable only through a merge's second parent ran a PR's
        # partial ci-ok, not main's.
        run: git rev-list --first-parent origin/main | grep -x "$GITHUB_SHA" > /dev/null
      - id: ci_ok
        name: ci-ok passed on the tagged commit
        continue-on-error: ${{ env.DRY_RUN == '1' }}
        run: bash .github/scripts/ci-ok-guard.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      # Written before the publish steps, so a dry run's summary opens with the
      # guards' verdict rather than "would publish".
      - name: guard verdicts
        if: env.DRY_RUN == '1'
        env:
          OUTCOMES: plan=${{ steps.plan.outcome }} versions=${{ steps.versions.outcome }} reachable=${{ steps.reachable.outcome }} ci_ok=${{ steps.ci_ok.outcome }}
        run: |
          echo "guards: $OUTCOMES" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rehearse req_managed_agents
        if: github.event_name != 'push' && contains(format(' {0} ', steps.plan.outputs.packages), ' req_managed_agents ')
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash .github/scripts/publish-package.sh req_managed_agents
      - name: rehearse req_managed_agents_host
        if: github.event_name != 'push' && contains(format(' {0} ', steps.plan.outputs.packages), ' req_managed_agents_host ')
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash .github/scripts/publish-package.sh req_managed_agents_host
      - name: dry-run verdict
        if: always() && env.DRY_RUN == '1'
        env:
          OUTCOMES: plan=${{ steps.plan.outcome }} versions=${{ steps.versions.outcome }} reachable=${{ steps.reachable.outcome }} ci_ok=${{ steps.ci_ok.outcome }}
        run: |
          case "$OUTCOMES" in *failure*) exit 1 ;; esac

  publish:
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # hex.pm trusts this repository's publish.yml running in the `prod`
    # environment (workload identity): no stored key. Only this job may mint
    # the OIDC token. The job-level block replaces the workflow-level one, so it
    # restates what the job reads, which no longer includes the checks API.
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: hex supports workload identity
        run: bash .github/scripts/hex-workload-identity.sh
      - name: publish req_managed_agents
        if: contains(format(' {0} ', needs.guard.outputs.packages), ' req_managed_agents ')
        env:
          KIND: ${{ needs.guard.outputs.kind }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: bash .github/scripts/publish-package.sh req_managed_agents
      - name: publish req_managed_agents_host
        if: contains(format(' {0} ', needs.guard.outputs.packages), ' req_managed_agents_host ')
        env:
          KIND: ${{ needs.guard.outputs.kind }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: bash .github/scripts/publish-package.sh req_managed_agents_host
