name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      root: ${{ steps.select.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push to main selects everything: the ci-ok the publish guard reads
          # on a main commit must cover both packages.
          if [ "$EVENT" = pull_request ]; then
            bash .github/scripts/detect-changes.sh --diff "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/detect-changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  root:
    name: root (task runner)
    needs: detect-changes
    if: needs.detect-changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: mix test at the root fails, for the stated reason
        run: |
          out=$(mix test --only live 2>&1) && { echo "root mix test passed: $out"; exit 1; }
          grep -qF '** (Mix) run mix test from req_managed_agents/ or req_managed_agents_host/' <<<"$out"
      - name: the publish order lists each package directory, dependency first
        run: test "$(mix publish_order)" = "$(printf 'req_managed_agents\nreq_managed_agents_host')"
      - name: CI script tests
        run: for t in .github/scripts/test/*_test.sh; do echo "== $t"; bash "$t" || exit 1; done

  test:
    name: test ${{ matrix.package }} (Elixir ${{ matrix.leg.elixir }} / OTP ${{ matrix.leg.otp }})
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
        leg:
          # Floor claimed by both mix.exs files (`elixir: "~> 1.20"`), on the
          # two newest OTP releases.
          - elixir: "1.20"
            otp: "28"
          # Lint-class steps run on the newest OTP, where its deprecation
          # warnings appear first.
          - elixir: "1.20"
            otp: "29"
            lint: true
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.leg.elixir }}
          otp-version: ${{ matrix.leg.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: mix-${{ matrix.package }}-${{ runner.os }}-${{ matrix.leg.otp }}-${{ matrix.leg.elixir }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            mix-${{ matrix.package }}-${{ runner.os }}-${{ matrix.leg.otp }}-${{ matrix.leg.elixir }}-
      - name: the lock holds no Hex entry for the sibling
        if: matrix.package == 'req_managed_agents_host'
        run: |
          if grep -q '"req_managed_agents":' mix.lock; then
            echo "mix.lock still pins req_managed_agents from Hex; the sibling is a path dep" >&2
            exit 1
          fi
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
        if: ${{ matrix.leg.lint }}
      # :live tests are excluded in req_managed_agents' test_helper.exs, and
      # req_managed_agents_host's suite runs on an in-process stub provider:
      # no PR ever needs Anthropic or AWS credentials.
      - run: mix test

  quality:
    name: quality ${{ matrix.package }} (format, credo, docs, package)
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    env:
      # ex_doc is `only: :dev`, so `mix docs` doesn't exist under MIX_ENV=test.
      MIX_ENV: dev
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: mix-quality-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            mix-quality-${{ matrix.package }}-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      # Acknowledged advisories are listed in each mix.exs under
      # `hex: [ignore_advisories: ...]` (Hex 2.5.1+).
      - run: mix hex.audit
      - run: mix docs --warnings-as-errors
      # Publishable: Hex deps only (hex.build exits 1 on a path dep), LICENSE
      # shipped, and a sibling at the family minor. RMA_PUBLISH=1 swaps the
      # sibling path dep for its Hex requirement.
      - name: publishable
        env:
          RMA_PUBLISH: "1"
        run: |
          mix hex.build --output "$RUNNER_TEMP/package.tar"
          elixir ../.github/scripts/check_package.exs "$RUNNER_TEMP/package.tar"

  dialyzer:
    name: dialyzer ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: mix-dialyzer-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            mix-dialyzer-${{ matrix.package }}-${{ runner.os }}-
      # PLTs are cached separately from deps: they change on BEAM upgrades,
      # not on every mix.lock bump.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/priv/plts
          key: plt-${{ matrix.package }}-${{ runner.os }}-29-1.20-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            plt-${{ matrix.package }}-${{ runner.os }}-29-1.20-
      - run: mix deps.get
      - run: mix dialyzer --format github

  ci-ok:
    name: ci-ok
    if: always()
    needs: [detect-changes, root, test, quality, dialyzer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI graph includes every job
        run: bash .github/scripts/test/ci_ok_test.sh
      - name: every selected job passed; every skip was detect-changes' choice
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci-ok.sh
